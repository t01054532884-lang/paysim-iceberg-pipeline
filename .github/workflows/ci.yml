name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Iceberg jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-iceberg-spark-3.5-1.6.1

      - run: pip install -r requirements.txt

      - name: Test (작은 샘플 데이터로 bronze → silver → gold, 재실행, Iceberg 기능)
        run: pytest -v
